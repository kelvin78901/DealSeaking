<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 656" role="img" aria-label="服务器做门户和 API 采集，只认住宅 IP 的站点交给家里的节点" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9a92"/>
    </marker>
  </defs>
  <rect width="760" height="656" fill="#ffffff"/>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1f1f1f">服务器做门户和 API 采集，只认住宅 IP 的站点交给家里的节点</text>

  <!-- data sources -->
  <g>
    <rect x="24" y="56" width="216" height="56" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
    <text x="40" y="80" font-weight="600" fill="#1f1f1f">官方 API</text>
    <text x="40" y="96" font-size="11.5" fill="#6b6b6b">Best Buy · Woot · eBay</text>
  </g>
  <g>
    <rect x="260" y="56" width="216" height="56" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
    <text x="276" y="80" font-weight="600" fill="#1f1f1f">RSS feed</text>
    <text x="276" y="96" font-size="11.5" fill="#6b6b6b">DealNews · Slickdeals 搜索</text>
  </g>
  <g>
    <rect x="496" y="56" width="216" height="56" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
    <text x="512" y="80" font-weight="600" fill="#1f1f1f">零售商网页</text>
    <text x="512" y="96" font-size="11.5" fill="#6b6b6b">Micro Center（没有 API）</text>
  </g>

  <!-- server -->
  <rect x="24" y="136" width="452" height="400" rx="8" fill="#f3f2ee" stroke="#9a9a92" stroke-width="1.25"/>
  <text x="40" y="158" font-weight="600" fill="#1f1f1f">云服务器（VPS）</text>
  <g>
    <rect x="40" y="176" width="420" height="56" rx="8" fill="#ffffff" stroke="#9a9a92" stroke-width="1.25"/>
    <text x="56" y="200" font-weight="600" fill="#1f1f1f">采集 worker</text>
    <text x="56" y="216" font-size="11.5" fill="#6b6b6b">按每个来源的配额和限速调 API、拉 RSS</text>
  </g>
  <g>
    <rect x="40" y="256" width="420" height="72" rx="8" fill="#ffffff" stroke="#9a9a92" stroke-width="1.25"/>
    <text x="56" y="280" font-weight="600" fill="#1f1f1f">处理流水线</text>
    <text x="56" y="296" font-size="11.5" fill="#6b6b6b">归一价格与成色 → 商品匹配（GTIN / MPN / 型号）</text>
    <text x="56" y="312" font-size="11.5" fill="#6b6b6b">→ 与上次比较，生成新上架 / 降价 / 补货事件</text>
  </g>
  <g>
    <rect x="40" y="352" width="420" height="56" rx="8" fill="#ffffff" stroke="#9a9a92" stroke-width="1.25"/>
    <text x="56" y="376" font-weight="600" fill="#1f1f1f">Postgres（各组件共用）</text>
    <text x="56" y="392" font-size="11.5" fill="#6b6b6b">商品 · 报价 · 价格历史 · 规则 · 订阅 · 通知出箱</text>
  </g>
  <g>
    <rect x="40" y="432" width="200" height="88" rx="8" fill="#ffffff" stroke="#9a9a92" stroke-width="1.25"/>
    <text x="56" y="456" font-weight="600" fill="#1f1f1f">规则匹配与出箱</text>
    <text x="56" y="472" font-size="11.5" fill="#6b6b6b">倒排索引取候选规则</text>
    <text x="56" y="488" font-size="11.5" fill="#6b6b6b">去重 · 冷却 · 套餐配额</text>
    <text x="56" y="504" font-size="11.5" fill="#6b6b6b">发信前复核链接与价格</text>
  </g>
  <g>
    <rect x="260" y="432" width="200" height="88" rx="8" fill="#ffffff" stroke="#9a9a92" stroke-width="1.25"/>
    <text x="276" y="456" font-weight="600" fill="#1f1f1f">Web 门户 / API</text>
    <text x="276" y="472" font-size="11.5" fill="#6b6b6b">验证码登录 · Turnstile</text>
    <text x="276" y="488" font-size="11.5" fill="#6b6b6b">deal feed · 规则编辑</text>
    <text x="276" y="504" font-size="11.5" fill="#6b6b6b">套餐 · /go 出站跳转</text>
  </g>

  <!-- home node -->
  <g>
    <rect x="496" y="176" width="216" height="72" rx="8" fill="#2f6fdc" fill-opacity="0.12" stroke="#2f6fdc" stroke-width="2"/>
    <text x="512" y="200" font-weight="600" fill="#1f1f1f">家用采集节点</text>
    <text x="512" y="216" font-size="11.5" fill="#1f1f1f">现有 openbox-monitor 容器</text>
    <text x="512" y="232" font-size="11.5" fill="#1f1f1f">住宅 IP，低频抓取</text>
  </g>

  <!-- commerce -->
  <g>
    <rect x="496" y="352" width="216" height="72" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
    <text x="512" y="376" font-weight="600" fill="#1f1f1f">Stripe · 联盟网络</text>
    <text x="512" y="392" font-size="11.5" fill="#6b6b6b">订阅收款与 webhook</text>
    <text x="512" y="408" font-size="11.5" fill="#6b6b6b">出站链接参数 · 佣金报表</text>
  </g>

  <!-- outputs -->
  <g>
    <rect x="24" y="576" width="216" height="56" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
    <text x="40" y="600" font-weight="600" fill="#1f1f1f">邮件服务</text>
    <text x="40" y="616" font-size="11.5" fill="#6b6b6b">Resend：即时提醒 + 每日摘要</text>
  </g>
  <g>
    <rect x="260" y="576" width="216" height="56" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
    <text x="276" y="600" font-weight="600" fill="#1f1f1f">推送渠道</text>
    <text x="276" y="616" font-size="11.5" fill="#6b6b6b">Web Push · Telegram · ntfy</text>
  </g>
  <g>
    <rect x="496" y="576" width="216" height="56" rx="8" fill="none" stroke="#9a9a92" stroke-width="1.25"/>
    <text x="512" y="600" font-weight="600" fill="#1f1f1f">用户浏览器</text>
    <text x="512" y="616" font-size="11.5" fill="#6b6b6b">看 deal、管理规则、订阅</text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="#9a9a92" stroke-width="1.25">
    <path d="M200 112V176" marker-end="url(#arrow)"/>
    <path d="M368 112V176" marker-end="url(#arrow)"/>
    <path d="M604 112V176" marker-end="url(#arrow)"/>
    <path d="M604 248V292H460" marker-end="url(#arrow)"/>
    <path d="M250 232V256" marker-end="url(#arrow)"/>
    <path d="M250 328V352" marker-end="url(#arrow)"/>
    <path d="M140 408V432" marker-end="url(#arrow)"/>
    <path d="M360 408V432" marker-end="url(#arrow)"/>
    <path d="M100 520V576" marker-end="url(#arrow)"/>
    <path d="M200 520V556H368V576" marker-end="url(#arrow)"/>
    <path d="M420 520V556H604V576" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M496 388H484V476H460" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="540" y="284" text-anchor="middle" font-size="11.5" fill="#6b6b6b">HTTPS 推送结果</text>
</svg>
