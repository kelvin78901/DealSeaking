[project]
name = "dealseaking"
version = "0.1.0"
description = "US electronics deal-alert portal"
requires-python = ">=3.12"
# Shared dependency list. Parallel tasks: add what you need in your own PR,
# one dependency per line, keep the list sorted to make merges trivial.
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12",
    "curl_cffi>=0.10",
    "fastapi>=0.115",
    "feedparser>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dealseaking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["legacy"]
